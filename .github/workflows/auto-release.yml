name: Auto release

# Release jobs are serialized, but GitHub keeps only one pending job in a
# concurrency group. Every surviving job therefore catches up all
# release-affecting merged PRs after the newest numbered changelog entry. Each
# release is rebuilt on the current origin/main and pushed with its tag atomically.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  actions: write
  issues: read
  pull-requests: read

jobs:
  release:
    if: github.event.pull_request.merged == true
    concurrency:
      group: auto-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Release every merged PR not yet in the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_PR: ${{ github.event.pull_request.number }}
          TRIGGER_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          max_attempts=3

          prs_file="$RUNNER_TEMP/merged-prs.json"
          candidates_file="$RUNNER_TEMP/release-candidates.jsonl"
          resolved_file="$RUNNER_TEMP/resolved-candidates.json"
          resolved_jsonl="$RUNNER_TEMP/resolved-candidates.jsonl"
          pending_file="$RUNNER_TEMP/pending-releases.jsonl"

          dispatch_release() {
            local tag="$1"
            local tag_commit="$2"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error title=Invalid release tag::Refusing to dispatch non-version tag: $tag"
              return 1
            fi

            local dispatched=false
            local dispatch_attempt
            for ((dispatch_attempt = 1; dispatch_attempt <= max_attempts; dispatch_attempt++)); do
              if gh workflow run release.yml --ref "$tag"; then
                dispatched=true
                break
              fi
              echo "::warning title=Release dispatch retry::$tag attempt $dispatch_attempt failed"

              # A transport failure can happen after GitHub accepted the dispatch.
              # Give the run list a bounded chance to expose that active build
              # before sending the same tag again.
              local visibility_attempt active_status
              for ((visibility_attempt = 1; visibility_attempt <= max_attempts; visibility_attempt++)); do
                if active_release_run "$tag" "$tag_commit"; then
                  echo "Release build for $tag appeared after dispatch failure; not retrying."
                  dispatched=true
                  break 2
                else
                  active_status=$?
                fi
                if ((active_status != 1)); then
                  return "$active_status"
                fi
                if ((visibility_attempt < max_attempts)); then
                  sleep 1
                fi
              done
            done
            if [[ "$dispatched" != true ]]; then
              echo "::error title=Release build dispatch failed::Release build dispatch failed for $tag after $max_attempts attempts"
              return 1
            fi
          }

          release_exists() {
            local tag="$1"
            local response_file
            response_file="$(mktemp)"
            if gh api -i "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$response_file"; then
              rm -f "$response_file"
              return 0
            fi
            if grep -qE '^HTTP/[0-9.]+ 404' "$response_file"; then
              rm -f "$response_file"
              return 1
            fi
            cat "$response_file" >&2
            rm -f "$response_file"
            echo "::error title=Release lookup failed::Could not inspect release $tag"
            return 2
          }

          active_release_run() {
            local tag="$1"
            local tag_commit="$2"
            local runs_file="$RUNNER_TEMP/release-runs-$tag.json"
            if ! gh run list --workflow release.yml --commit "$tag_commit" \
              --json status,headBranch,headSha --limit 100 > "$runs_file"; then
              echo "::error title=Release run lookup failed::Could not inspect release builds for $tag"
              return 2
            fi
            jq -e --arg tag "$tag" --arg commit "$tag_commit" '
              any(.[]; (.headSha == $commit or .headBranch == $tag) and
                (.status == "queued" or .status == "requested" or .status == "pending" or
                 .status == "waiting" or .status == "in_progress"))
            ' "$runs_file" >/dev/null
          }

          recover_pushed_tags() {
            local tag tag_commit release_status
            if ! git fetch origin main --tags; then
              echo "::error title=Recovery fetch failed::Could not fetch trusted main and release tags"
              return 1
            fi

            while IFS=$'\t' read -r tag tag_commit; do
              [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && -n "$tag_commit" ]] || continue
              [[ "$(git log -1 --format=%s "$tag_commit")" == "release: $tag" ]] || continue
              git merge-base --is-ancestor "$tag_commit" origin/main || continue

              if release_exists "$tag"; then
                echo "Release $tag already exists; recovery skipped."
                continue
              else
                release_status=$?
              fi
              if ((release_status != 1)); then
                return "$release_status"
              fi
              if active_release_run "$tag" "$tag_commit"; then
                echo "Release build for $tag is already active; recovery skipped."
                continue
              else
                release_status=$?
              fi
              if ((release_status != 1)); then
                return "$release_status"
              fi
              dispatch_release "$tag" "$tag_commit"
            done < <(git for-each-ref --format='%(refname:short)%09%(*objectname)' refs/tags)
          }

          # A successful atomic push can outlive an exhausted dispatch retry.
          # Reconcile that durable state before PR selection can exit empty.
          recover_pushed_tags

          # Paginate to the end rather than imposing a burst-size ceiling. The
          # helper finds the newest numbered changelog boundary, so historical
          # gaps before that release are never recreated.
          pulls_loaded=false
          for ((api_attempt = 1; api_attempt <= max_attempts; api_attempt++)); do
            if gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/pulls?state=closed&base=main&sort=created&direction=desc&per_page=100" \
              --jq '.[] | select(.merged_at != null) | {number, title, mergedAt: .merged_at}' \
              | jq -s '.' > "$prs_file"; then
              pulls_loaded=true
              break
            fi
            echo "::warning title=Pull list retry::Merged PR lookup attempt $api_attempt failed"
          done
          if [[ "$pulls_loaded" != true ]]; then
            echo "::error title=Pull list failed::Could not load merged PRs after $max_attempts attempts"
            exit 1
          fi
          node scripts/auto-release.js select \
            --prs "$prs_file" --changelog CHANGELOG.md > "$candidates_file"

          : > "$resolved_jsonl"
          while IFS= read -r candidate_json; do
            number="$(jq -r '.number' <<<"$candidate_json")"
            if [[ "$number" == "$TRIGGER_PR" ]]; then
              jq -c --arg titleAtMerge "$TRIGGER_TITLE" \
                '. + {titleAtMerge: $titleAtMerge}' <<<"$candidate_json" >> "$resolved_jsonl"
              continue
            fi

            events_file="$RUNNER_TEMP/pr-$number-events.json"
            events_loaded=false
            for ((api_attempt = 1; api_attempt <= max_attempts; api_attempt++)); do
              if gh api --paginate \
                -H "Accept: application/vnd.github+json" \
                "repos/$GITHUB_REPOSITORY/issues/$number/events?per_page=100" \
                --jq '.[]' | jq -s '.' > "$events_file"; then
                events_loaded=true
                break
              fi
              echo "::warning title=PR event retry::PR #$number event lookup attempt $api_attempt failed"
            done
            if [[ "$events_loaded" != true ]]; then
              echo "::error title=PR event lookup failed::Could not load events for PR #$number after $max_attempts attempts"
              exit 1
            fi
            jq -c --slurpfile events "$events_file" \
              '. + {events: $events[0]}' <<<"$candidate_json" >> "$resolved_jsonl"
          done < "$candidates_file"

          jq -s '.' "$resolved_jsonl" > "$resolved_file"
          node scripts/auto-release.js pending \
            --prs "$resolved_file" > "$pending_file"

          if [[ ! -s "$pending_file" ]]; then
            echo "No release-affecting merged PR is waiting."
            exit 0
          fi

          while IFS= read -r release_json; do
            number="$(jq -r '.number' <<<"$release_json")"
            title="$(jq -r '.title' <<<"$release_json")"
            bump="$(jq -r '.bump' <<<"$release_json")"
            pushed=false
            already_released=false

            for ((attempt = 1; attempt <= max_attempts; attempt++)); do
              # A normal PR merge can move main while this job owns the release
              # concurrency group, so every attempt starts from the remote tip.
              if ! git fetch origin main; then
                echo "::warning title=Release fetch retry::PR #$number fetch attempt $attempt failed"
                continue
              fi
              git reset --hard origin/main

              if grep -qE "\\(#$number\\)[[:space:]]*$" CHANGELOG.md; then
                echo "PR #$number was released by another run; skipping."
                already_released=true
                break
              fi

              npm version "$bump" --no-git-tag-version
              version="$(node -p 'require("./package.json").version')"
              tag="v$version"
              node scripts/changelog.js \
                --version "$version" --title "$title" --pr "$number" --date "$(date -u +%F)"
              git add package.json package-lock.json CHANGELOG.md
              git commit -m "release: $tag"
              git tag -a "$tag" -m "$tag"

              if git push --atomic origin HEAD:main "refs/tags/$tag:refs/tags/$tag"; then
                pushed=true
                break
              fi

              git tag -d "$tag"
              echo "::warning title=Release push retry::PR #$number push attempt $attempt failed"
            done

            if [[ "$already_released" == true ]]; then
              continue
            fi
            if [[ "$pushed" != true ]]; then
              echo "::error title=Release push failed::Could not release PR #$number after $max_attempts attempts"
              exit 1
            fi

            # Tags pushed with GITHUB_TOKEN do not trigger tag-push workflows,
            # so request the build explicitly after the unchanged atomic push.
            dispatch_release "$tag" "$(git rev-parse "$tag^{commit}")"
          done < "$pending_file"
