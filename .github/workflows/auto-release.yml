name: Auto release

# Cuts a release automatically when a PR merges to main, sized by the
# conventional-commit prefix of the PR title:
#
#   feat!: / fix!: / any `type!:`  → major
#   feat:                          → minor
#   fix: / perf: / refactor:       → patch
#   anything else (chore:, docs:, ci:, free-form, "[skip release]") → no release
#
# The version bump lands as a commit on main plus a `v<version>` tag, and
# the Release builds workflow is dispatched on that tag to build and publish
# the installers.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Decide version bump from the PR title
        id: bump
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The regexes live in variables: bash cannot parse `[^)]` inside
          # an inline [[ =~ ]] expression.
          major_re='^[a-z]+(\([^)]*\))?!:'
          minor_re='^feat(\([^)]*\))?:'
          patch_re='^(fix|perf|refactor)(\([^)]*\))?:'
          bump=""
          if [[ "$TITLE" == *"[skip release]"* ]]; then
            bump=""
          elif [[ "$TITLE" =~ $major_re ]]; then
            bump=major
          elif [[ "$TITLE" =~ $minor_re ]]; then
            bump=minor
          elif [[ "$TITLE" =~ $patch_re ]]; then
            bump=patch
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "PR title: $TITLE → bump: ${bump:-none}"

      - name: Bump version, record the changelog, commit and tag
        if: steps.bump.outputs.bump != ''
        env:
          TITLE: ${{ github.event.pull_request.title }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # --no-git-tag-version so the changelog entry can ride along in the
          # same release commit: `npm version` refuses to run with anything
          # else staged, and it must not tag before CHANGELOG.md is written.
          npm version "${{ steps.bump.outputs.bump }}" --no-git-tag-version
          version="$(node -p 'require("./package.json").version')"
          # This PR *is* the release (one merged PR per version, see the bump
          # rules above), so its title is the release note. The app shows this
          # entry — from the published release-notes.json before updating, and
          # from the copy inside its own bundle right after.
          node scripts/changelog.js \
            --version "$version" --title "$TITLE" --pr "$PR" --date "$(date -u +%F)"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "release: v$version"
          git tag -a "v$version" -m "v$version"
          git push origin main --follow-tags

      - name: Trigger release builds
        if: steps.bump.outputs.bump != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags pushed with the workflow's GITHUB_TOKEN do not fire on:push
          # workflows (GitHub recursion guard), so dispatch the build
          # workflow on the new tag explicitly.
          gh workflow run release.yml \
            --ref "v$(node -p 'require("./package.json").version')"
