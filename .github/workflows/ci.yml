name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    # The in-process engines ship per-platform native binaries, so exercise
    # install + tests + boot on all three target OSes, not just Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm test
      # Electron needs a display; Linux runners are headless so wrap with xvfb.
      - name: Smoke test (headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron . --smoke-test --no-sandbox
      - name: Smoke test
        if: runner.os != 'Linux'
        run: npx electron . --smoke-test --no-sandbox
      # Boot the engine utilityProcess worker, round-trip a ping, and load both
      # native addons, so a broken worker or an addon that no longer links
      # against this Electron's ABI surfaces here rather than at runtime.
      - name: Engine worker boot (headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron scripts/engine-smoke.js --no-sandbox
      - name: Engine worker boot
        if: runner.os != 'Linux'
        run: npx electron scripts/engine-smoke.js --no-sandbox
      # Drive the real overlay page against Chromium's fake audio device and
      # verify the capture/UI sync contract: "Listening…" appears only once
      # samples actually flow, and the captured WAV covers everything said
      # from that moment on.
      - name: Overlay capture sync (headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron scripts/overlay-smoke.js --no-sandbox
      - name: Overlay capture sync
        if: runner.os != 'Linux'
        run: npx electron scripts/overlay-smoke.js --no-sandbox
      # Drive the real settings window and verify the settings-page contract:
      # one continuous scroll, the scroll-spy index, and the seated roving
      # tabindex.
      - name: Settings panel smoke (headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron scripts/settings-smoke.js --no-sandbox
      - name: Settings panel smoke
        if: runner.os != 'Linux'
        run: npx electron scripts/settings-smoke.js --no-sandbox

  # A tracked symlink is the one breakage the jobs above structurally cannot
  # catch: they run `npm ci`, which rebuilds node_modules over whatever the
  # checkout put there, so a self-referencing `node_modules` symlink committed
  # to the tree stays green here and only fails on a real clone (ELOOP on every
  # access — npm ci, require.resolve, anything walking the tree). That is
  # exactly how one reached main in #107. This job looks at the index instead of
  # the working tree, so nothing can paper over it.
  #
  # Own job rather than a step in `app`: it needs no Node and no Electron, and
  # as a step it would run three times over for the OS matrix.
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No tracked symlinks
        run: |
          # Mode 120000 is git's symlink mode. The repo has none, and none is
          # the intended steady state — if a symlink is ever wanted here on
          # purpose, allow it explicitly rather than dropping this check.
          found=$(git ls-files -s | awk '$1 == "120000" { print $4 }')
          if [ -n "$found" ]; then
            echo "::error::Tracked symlink(s) found — these break a fresh clone:"
            echo "$found" | sed 's/^/  /'
            exit 1
          fi
      - name: No committed dependency or build output
        run: |
          # .gitignore covers these, but `git add -f` (or an ignore rule that
          # misses, as `node_modules/` did for a symlink) still gets past it.
          found=$(git ls-files | grep -E '^(node_modules|dist)(/|$)' || true)
          if [ -n "$found" ]; then
            echo "::error::Dependency/build paths are committed:"
            echo "$found" | head -20 | sed 's/^/  /'
            exit 1
          fi

  stt-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stt-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install
        run: uv venv && uv pip install -e .
      - name: Import check
        run: uv run python -c "from earheart_stt.server import create_app; create_app()"
