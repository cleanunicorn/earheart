# TEMPORARY diagnostic for PR #396: one Windows runner per suspect test file,
# so a file that freezes its machine only times out its own job. The job
# statuses alone identify it. Delete before merging.
name: diag-hang
on:
  push:
    branches: [batch/20261108-2013]
jobs:
  one-file:
    runs-on: windows-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        file:
          - test/ducking.test.js
          - test/command-wiring.test.js
          - test/command-platform.test.js
          - test/command-session.test.js
          - test/command-selection.test.js
          - test/deliver.test.js
          - test/double-tap.test.js
          - test/overlay-mic.test.js
    name: ${{ matrix.file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version-file: .nvmrc }
      - run: npm ci
      - run: npx --no install-electron
      - name: Run the file alone
        run: node --test --test-timeout=60000 ${{ matrix.file }}
