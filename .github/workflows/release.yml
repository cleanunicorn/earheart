name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# auto-release.yml dispatches this workflow with a tag ref (`--ref v<version>`),
# so the normal path always runs on a tag: create the release, build, publish.
# A manual workflow_dispatch against a branch is a dry-run — it builds and
# uploads CI artifacts but creates/publishes nothing (create-release is skipped,
# and the build job's upload steps run only on a tag).

permissions:
  contents: write

# A dispatch client can lose its response after GitHub accepted the request.
# Serialize each ref as a server-side backstop against duplicate tag builds.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Create the GitHub release once, up front, so the three platform build jobs
  # upload into one existing release instead of each racing to create it. When
  # they raced, concurrent release creation clobbered asset uploads — v0.6.0
  # lost its macOS dmg/zip/latest-mac.yml that way. The release is created as a
  # draft: each platform verifies its packaged app, then uploads into it by tag
  # (gh release upload), so the in-progress release stays hidden from users
  # until publish-release flips it live after every platform has uploaded. Only
  # runs on a tag push.
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # Checked out for CHANGELOG.md — the release-notes asset below is built
      # from the tagged tree. `gh` itself works over the API with GH_TOKEN, so
      # the checkout keeps no token in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the draft release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass the repo explicitly rather than inferring it from the
          # checkout's remote (matches publish-release, which has no checkout).
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # The tag reaches the release commands as a literal arg (env-var
          # indirection + quoting), but guard the shape anyway so a stray tag
          # can never be parsed as a flag or seed a release for a non-version
          # ref. The push trigger already filters to v*; this pins it to vN.
          if [[ ! "$tag" =~ ^v[0-9] ]]; then
            echo "Refusing to create a release for non-version tag: $tag"
            exit 1
          fi
          # Reuse an existing release so a re-run is idempotent. A tag whose
          # release is already published (non-draft) gets no new uploads: the
          # upload steps refuse it rather than replace live installers — re-run
          # from a fresh tag instead.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, reusing it."
          else
            gh release create "$tag" --draft --title "$tag" --generate-notes
          fi

      # The in-app updater's "what's new": uploaded next to latest*.yml so the
      # app fetches it from the same feed base it already reads the version
      # from (releases/latest/download/…), including an EARHEART_UPDATE_FEED
      # test feed. --clobber so a re-run replaces it rather than failing.
      - name: Publish the release notes the updater reads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          node scripts/release-notes.js --out release-notes.json
          gh release upload "${GITHUB_REF_NAME}" release-notes.json --clobber

  build:
    needs: create-release
    # workflow_dispatch on a branch skips create-release; don't block the build
    # job on a skipped dependency.
    if: ${{ always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    strategy:
      # One platform failing must not cancel the other platforms' uploads.
      fail-fast: false
      matrix:
        # macOS builds on Apple Silicon only, installing and testing the arm64
        # native addons; Intel Macs are not built (the last was v0.33.9).
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # No token left in .git/config while `npm ci` runs install scripts: this
      # job never uses git credentials (uploads go through GH_TOKEN).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      # Every platform builds locally, boots the PACKAGED app and loads its
      # native engines, and only then uploads (#174): an asarUnpack or missing
      # per-OS addon regression fails here instead of reaching the release.
      # ci.yml only smoke-tests the unpackaged tree.
      - name: Build Linux and Windows installers
        if: runner.os != 'macOS'
        run: npx electron-builder --publish never
      - name: Verify packaged Linux app and engines
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          # --engine-check loads the native addons from inside the package, so
          # a missing app.asar.unpacked addon fails here. (engine-smoke.js with
          # EARHEART_ENGINE_ROOT would add nothing: run from the checkout, it
          # resolves modules from the repo's node_modules, not the package's.)
          xvfb-run -a dist/linux-unpacked/earheart --smoke-test --engine-check --no-sandbox
      - name: Verify packaged Windows app and engines
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: bash
        run: |
          dist/win-unpacked/Earheart.exe --smoke-test --engine-check
      # electron-builder's own publisher uploads Windows artifacts under dashed
      # names ("Earheart-Setup-1.2.3.exe"), the names latest.yml points at; a
      # local file can carry spaces. Match them, then refuse to upload a feed
      # whose files aren't all here — a mismatch would break auto-update.
      - name: Upload verified Linux and Windows installers and feed
        if: runner.os != 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Never replace the installers of a release users already have.
          if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft)" != true ]]; then
            echo "::error::release $GITHUB_REF_NAME is already published; re-run from a fresh tag"
            exit 1
          fi
          shopt -s nullglob
          for f in dist/*.exe dist/*.exe.blockmap; do
            dashed="${f// /-}"
            if [[ "$f" != "$dashed" ]]; then mv "$f" "$dashed"; fi
          done
          if [[ "$RUNNER_OS" == Linux ]]; then
            feed=dist/latest-linux.yml
            files=(dist/*.AppImage dist/*.deb "$feed")
          else
            feed=dist/latest.yml
            files=(dist/*.exe dist/*.exe.blockmap "$feed")
          fi
          node scripts/check-release-feed.js "$feed"
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
      # Build locally first: publish macOS only after the packaged app and
      # its bundled native engines pass on the matching hardware.
      # Sign with Earheart's Apple Developer ID certificate and notarize with an
      # App Store Connect API key, so Gatekeeper opens the app on first launch
      # and macOS keeps Accessibility/Automation grants across updates (the
      # designated requirement names the Team ID, not a per-build hash). A tag
      # build without every secret fails rather than publishing an unsigned or
      # un-notarized app; a branch dry-run without them builds unsigned and
      # skips notarization. The certificate goes into a throwaway keychain,
      # where electron-builder finds the trusted identity itself.
      - name: Import the macOS signing certificate and notarization key
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          missing=()
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            if [[ "$IS_TAG" == true ]]; then
              echo "::error::${missing[*]} not set; refusing to publish an unsigned or un-notarized macOS build"
              exit 1
            fi
            echo "Signing secrets incomplete on this dry run (${missing[*]}); building unsigned."
            # Don't let electron-builder pick up any identity the runner has.
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          keychain="$RUNNER_TEMP/earheart-signing.keychain-db"
          p12="$RUNNER_TEMP/earheart-signing.p12"
          p8="$RUNNER_TEMP/earheart-notary.p8"
          kc_pass="$(openssl rand -base64 24)"
          echo "::add-mask::$kc_pass"
          printf %s "$MAC_CSC_LINK" | base64 --decode > "$p12"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$p12" -k "$keychain" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$p12"
          # The imported certificate must be Earheart's Developer ID, and the
          # system must trust it (-v), or electron-builder won't sign with it.
          security find-identity -v -p codesigning "$keychain" | grep -q 'Developer ID Application: .*(XTZB5CXLUQ)' || {
            echo "::error::MAC_CSC_LINK holds no valid 'Developer ID Application' identity for team XTZB5CXLUQ"
            exit 1
          }
          (umask 077 && printf %s "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$p8")
          {
            # electron-builder signs from this keychain and notarizes with this
            # key; the dmg notarization step reuses both.
            echo "CSC_KEYCHAIN=$keychain"
            echo "APPLE_API_KEY=$p8"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_ID"
          } >> "$GITHUB_ENV"
      - name: Build macOS installers
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never
      # electron-builder notarized and stapled the .app (inside both the zip
      # and the dmg); the dmg itself is signed but needs its own ticket so
      # Gatekeeper accepts it offline on first open.
      - name: Notarize and staple the macOS dmg
        if: runner.os == 'macOS' && env.APPLE_API_KEY != ''
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(ls dist/Earheart-*-arm64.dmg)
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
      - name: Verify packaged macOS app and engines
        timeout-minutes: 5
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          expected=arm64
          bundle=dist/mac-arm64/Earheart.app
          dmg=$(ls dist/Earheart-*-arm64.dmg)
          zip=$(ls dist/Earheart-*-arm64-mac.zip)
          test "$(node -p process.arch)" = "$expected"
          if [[ -n "${APPLE_API_KEY:-}" ]]; then
            codesign --verify --deep --strict "$bundle"
            details=$(codesign -dv "$bundle" 2>&1)
            echo "$details"
            grep -q "flags=.*runtime" <<< "$details"
            grep -q "^Authority=Developer ID Application: .*(XTZB5CXLUQ)$" <<< "$details"
            # macOS files permission grants under the designated requirement.
            # Developer ID's names the bundle id and team, not a certificate
            # hash, so grants survive updates and certificate renewals.
            requirement=$(codesign -dr - "$bundle" 2>&1)
            echo "$requirement"
            grep -q 'identifier "dev.cleanunicorn.earheart"' <<< "$requirement"
            grep -q 'certificate leaf\[subject.OU\] = XTZB5CXLUQ' <<< "$requirement"
            # Notarization tickets are stapled, so Gatekeeper accepts both
            # without a network lookup.
            xcrun stapler validate "$bundle"
            xcrun stapler validate "$dmg"
            # spctl prints its verdict on stderr; capture it and fail on
            # anything but a notarized Developer ID acceptance.
            app_verdict=$(spctl -a -vvv -t exec "$bundle" 2>&1)
            echo "$app_verdict"
            grep -q ": accepted$" <<< "$app_verdict"
            grep -q "^source=Notarized Developer ID$" <<< "$app_verdict"
            dmg_verdict=$(spctl -a -vvv -t open --context context:primary-signature "$dmg" 2>&1)
            echo "$dmg_verdict"
            grep -q ": accepted$" <<< "$dmg_verdict"
            grep -q "^source=Notarized Developer ID$" <<< "$dmg_verdict"
            # The in-app updater installs from the zip and re-signs ad-hoc
            # anything that doesn't verify, which would void users' grants.
            staging="$RUNNER_TEMP/zip-check"
            rm -rf "$staging" && mkdir -p "$staging"
            ditto -xk "$zip" "$staging"
            codesign --verify --deep --strict "$staging/Earheart.app"
          fi
          # --engine-check loads the native addons inside the packaged app, so
          # the signed bundle's library validation is what gets tested. (The
          # engine-smoke run after it resolves modules from the checkout's
          # node_modules; it checks the worker plumbing, not the package.)
          "$bundle/Contents/MacOS/Earheart" --smoke-test --engine-check --no-sandbox
          EARHEART_ENGINE_ROOT="$PWD/$bundle/Contents/Resources/app.asar" \
            npx electron scripts/engine-smoke.js --no-sandbox
      - name: Remove the signing keychain and notarization key
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [[ -n "${CSC_KEYCHAIN:-}" ]]; then security delete-keychain "$CSC_KEYCHAIN" || true; fi
          if [[ -n "${APPLE_API_KEY:-}" ]]; then rm -f "$APPLE_API_KEY"; fi
      - name: Upload verified macOS installers and feed
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Never replace the installers of a release users already have.
          if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft)" != true ]]; then
            echo "::error::release $GITHUB_REF_NAME is already published; re-run from a fresh tag"
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-mac*.yml --clobber
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: earheart-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/latest*.yml
          if-no-files-found: ignore

  # Flip the draft release live once every platform has uploaded its installers,
  # so users never see a release with a missing platform mid-build. Runs only on
  # a tag push (create-release ran) and only if all build jobs succeeded — a
  # failed platform leaves the release as a draft to fix rather than shipping a
  # partial release.
  publish-release:
    needs: [create-release, build]
    # always() so this is evaluated explicitly (mirrors the build job); the
    # success-of-both gate then publishes only when every platform uploaded.
    if: ${{ always() && needs.create-release.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --repo "$GITHUB_REPOSITORY"
