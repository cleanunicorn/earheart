appId: dev.cleanunicorn.earheart
productName: Earheart
copyright: Copyright © 2026 Earheart contributors

directories:
  output: dist
  buildResources: build

# The update feed the app reads. release.yml builds with --publish never, which
# still writes latest*.yml and the bundled app-update.yml from this block; it
# then verifies the packaged app and uploads the installers into the tag's
# draft release itself, and publish-release makes it live once every platform
# has uploaded. releaseType only applies if electron-builder creates a release.
publish:
  provider: github
  releaseType: release

files:
  - main/**/*
  - renderer/**/*
  - preload.js
  - assets/**/*
  - package.json
  # Shipped so the app can show what changed right after it updates itself,
  # without asking the network for notes it already carries.
  - CHANGELOG.md

# The in-process engines ship native addons (.node) and shared libraries
# (.so/.dylib/.dll) that the OS loader must read from real files on disk, not
# from inside the asar archive. Unpack them so sherpa-onnx (STT) and
# node-llama-cpp (cleanup) load at runtime. Production deps are bundled
# automatically; models are downloaded at first run, not packaged.
asarUnpack:
  - "**/*.node"
  - "node_modules/sherpa-onnx-node/**"
  - "node_modules/sherpa-onnx-*/**"
  - "node_modules/node-llama-cpp/**"
  - "node_modules/@node-llama-cpp/**"

linux:
  target:
    - AppImage
    - deb
  category: Utility
  icon: assets/icon.png
  synopsis: Voice dictation for coding agents — private and fully local
  desktop:
    entry:
      StartupWMClass: earheart

# Build on a native Apple Silicon runner so npm installs the arm64 native
# addons. release.yml boots the packaged app and loads its engines before
# uploading it with latest-mac.yml. Intel Macs are not built (the last was
# v0.33.9).
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  icon: assets/icon.png
  hardenedRuntime: true
  # Release builds are signed with Earheart's Apple Developer ID certificate
  # (Team XTZB5CXLUQ) and notarized. release.yml supplies the certificate
  # (CSC_LINK / CSC_KEY_PASSWORD) and the App Store Connect API key
  # (APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER); electron-builder
  # finds the trusted identity itself, signs every Mach-O in the bundle with a
  # secure timestamp, notarizes and staples. Without them — local
  # `npm run dist:mac`, PR CI, a branch dry run with no secrets — the build is
  # unsigned and notarization is skipped. See docs/macos-signing.md.
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: >-
      Earheart records your voice while dictating so it can be transcribed.
    # Without this string macOS denies the Automation request silently instead
    # of showing the "Earheart wants to control System Events" prompt.
    NSAppleEventsUsageDescription: >-
      Earheart presses Cmd+V in the app you are working in to paste what you
      dictated.

# electron-builder notarizes and staples the .app only. Sign the dmg too, so
# release.yml can notarize and staple it after the build. Stapling rewrites
# the dmg, so it stays out of latest-mac.yml (and gets no blockmap): a hash
# written before stapling would be stale. The in-app updater installs from
# the zip, which is all the feed needs.
dmg:
  sign: true
  writeUpdateInfo: false

win:
  target:
    - nsis
    - portable
  icon: assets/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
