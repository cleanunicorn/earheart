appId: dev.cleanunicorn.earheart
productName: Earheart
copyright: Copyright © 2026 Earheart contributors

directories:
  output: dist
  buildResources: build

# Where `electron-builder --publish` uploads installers. releaseType: release
# publishes immediately (not a draft) so tag builds are fully automatic.
publish:
  provider: github
  releaseType: release

files:
  - main/**/*
  - renderer/**/*
  - preload.js
  - assets/**/*
  - package.json
  # Shipped so the app can show what changed right after it updates itself,
  # without asking the network for notes it already carries.
  - CHANGELOG.md

# The in-process engines ship native addons (.node) and shared libraries
# (.so/.dylib/.dll) that the OS loader must read from real files on disk, not
# from inside the asar archive. Unpack them so sherpa-onnx (STT) and
# node-llama-cpp (cleanup) load at runtime. Production deps are bundled
# automatically; models are downloaded at first run, not packaged.
asarUnpack:
  - "**/*.node"
  - "node_modules/sherpa-onnx-node/**"
  - "node_modules/sherpa-onnx-*/**"
  - "node_modules/node-llama-cpp/**"
  - "node_modules/@node-llama-cpp/**"

linux:
  target:
    - AppImage
    - deb
  category: Utility
  icon: assets/icon.png
  synopsis: Voice dictation for coding agents — private and fully local
  desktop:
    entry:
      StartupWMClass: earheart

# Build on native Apple Silicon and Intel runners so npm installs the matching
# native addons. release.yml boots each packaged app and loads its engines
# before uploading. Keep latest-mac.yml for existing Apple Silicon installs;
# the Intel job publishes its metadata as latest-mac-x64.yml to avoid races.
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  icon: assets/icon.png
  hardenedRuntime: true
  # Release builds are signed with a stable self-signed certificate (see
  # release.yml), so macOS keeps Accessibility/Automation grants across
  # updates. Apple's timestamp server only stamps Apple-issued certificates,
  # and a timestamp matters only for notarization, which we don't do.
  timestamp: none
  # Signs by certificate hash, so the self-signed certificate needs no trust
  # settings on the CI runner. Leaves local builds unsigned.
  sign: ./build/mac-sign.js
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: >-
      Earheart records your voice while dictating so it can be transcribed.
    # Without this string macOS denies the Automation request silently instead
    # of showing the "Earheart wants to control System Events" prompt.
    NSAppleEventsUsageDescription: >-
      Earheart presses Cmd+V in the app you are working in to paste what you
      dictated.

win:
  target:
    - nsis
    - portable
  icon: assets/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
