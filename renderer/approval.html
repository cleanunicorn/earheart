<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
  <title>Tool approval · Earheart</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="approval.css" />
</head>
<body>
  <main>
    <h1 id="request-title">Allow this tool to run?</h1>
    <p id="empty" class="hint" hidden>Nothing is waiting for approval.</p>
    <section id="request" hidden aria-labelledby="request-title">
      <dl>
        <dt>Server</dt><dd id="server"></dd>
        <dt>Tool</dt><dd id="tool"></dd>
      </dl>
      <p class="hint" id="provenance">Server-provided text. Earheart cannot verify it; the tool may do more than it says.</p>
      <p id="description"></p>
      <label for="args">Arguments it will be called with</label>
      <pre id="args" tabindex="0" aria-label="Arguments"></pre>
      <p id="countdown" class="hint" role="timer"></p>
    </section>
    <footer>
      <button id="deny" autofocus>Deny</button>
      <button id="allow" class="primary" disabled>Allow once</button>
    </footer>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="approval.js"></script>
</body>
</html>
