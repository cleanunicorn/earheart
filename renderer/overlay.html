<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'"
    />
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <!--
      THESIS: A transcription bar that needs no manual — the live words ARE the
      interface, and every control is a glyph the whole world already reads.
      Refuses the hardware metaphor (tape, lamps, legends, eject) outright.
      OWN-WORLD: Solid neutral near-black bar, hairline edges, white/gray text;
      one coral accent (#fb4d5c, from the app icon's waveform-heart) that means
      "Earheart is working with your voice" — the capture dot, the live
      waveform, progress fills. Green/red exist only as tiny status dots.
      Circular ghost keys; one filled white Done key.
      STORY: A glance says: coral pulse + moving waveform + words appearing —
      it hears me. Check finishes and types the text, X discards, pause holds.
      FIRST VIEWPORT: One slim bar: status dot + word, live waveform, timer,
      pause, Done (white), discard; the live transcript grows upward above.
      FORM: Category canon (the clean minimal dictation bar), played straight —
      standing exit taken by the user; craft bar: Wispr Flow / superwhisper.
    -->
    <!-- One solid bar: the live transcript fills the top and grows freely; the
         control row sits along the bottom. The whole card is the drag surface
         and carries the data-status state. -->
    <!-- Initial state is "starting", matching what record:start shows: the card
         must never claim Listening… before the mic actually delivers audio. -->
    <div id="card" data-status="starting">
      <!-- Drag handle: the sheet-grabber bar that signifies the card is
           draggable (the OS ignores the CSS move-cursor on a focusable:false
           overlay, so a visible cue is needed). Decorative — the card itself
           handles the drag. -->
      <div id="grip" aria-hidden="true"></div>
      <!-- Update prompt: the whole point of putting it here is that this card is
           always-on-top and is the surface the user already looks at when they
           dictate. Main pins the card open for it and only ever raises it
           between dictations — never over words being spoken. -->
      <div id="update" hidden role="alert">
        <div id="update-head">
          <span id="update-title"></span>
          <button id="update-close" title="Later" aria-label="Later">
            <svg viewBox="0 0 16 16" width="10" height="10" aria-hidden="true">
              <path
                d="M4.2 4.2 L11.8 11.8 M11.8 4.2 L4.2 11.8"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                fill="none"
              />
            </svg>
          </button>
        </div>
        <div id="update-note"></div>
        <!-- What the new version brings: the top few changes, so the choice to
             update is made on what's in it rather than on a version number.
             The card has room for a few lines; Settings carries the full list. -->
        <ul id="update-notes" hidden></ul>
        <div id="update-bar" hidden aria-hidden="true">
          <div id="update-bar-fill"></div>
        </div>
        <div id="update-actions">
          <button id="update-now" class="pill primary"></button>
          <!-- Grouped so the two ways of saying no wrap to the next line
               together, instead of one of them dangling under the primary. -->
          <div id="update-outs">
            <button id="update-skip" class="pill quiet">Skip this version</button>
            <button id="update-never" class="pill quiet">Don't remind me</button>
          </div>
        </div>
      </div>
      <!-- Live transcript: shown while recording when live preview is on. The
           cleaned text is the settled line; the still-streaming raw tail trails
           it dimmed — fresh words brighten to white as cleanup settles them.
           Hidden (and empty) when there's nothing to show. -->
      <div id="transcript" hidden>
        <!-- Only the cleaned line is a polite live region: it settles in calm
             chunks on pauses, a natural announce cadence. The raw tail updates
             every ~1.2s and would be far too chatty for a screen reader. -->
        <span id="transcript-clean" aria-live="polite"></span
        ><span id="transcript-raw" aria-hidden="true"></span>
      </div>
      <!-- Control row: status word, live waveform, timer, and the three keys
           everyone already knows — pause, done, discard. -->
      <div id="controls">
        <!-- The state, said in one word next to its dot: Listening / Paused /
             Transcribing… / Pasted. Announced politely so assistive tech hears
             every state change without the timer's chatter. -->
        <div id="status" aria-live="polite" aria-atomic="true">
          <span id="status-dot" aria-hidden="true"></span>
          <span id="status-text">Starting mic…</span>
        </div>
        <!-- The live waveform is the proof of hearing: your voice drawn as it
             lands, newest at the right edge, carried left. Outside recording it
             dims to a ghost of the take and the detail line (paste preview,
             error, hint) takes the space. -->
        <div id="wave">
          <canvas id="meter" width="216" height="32" aria-hidden="true"></canvas>
          <!-- Polite live region so a screen reader hears the post-dictation
               detail (the pasted preview, an error message) — the feedback that
               tells the user whether their dictation landed. -->
          <span id="detail-text" aria-live="polite"></span>
          <!-- Determinate progress for the transcribing/cleaning phases.
               Overlaid on the wave area, so showing it never changes the card
               height. aria-hidden keeps the live region quiet: the status text
               already announces the phase. -->
          <div id="progress" hidden aria-hidden="true">
            <div id="progress-fill"></div>
          </div>
        </div>
        <!-- Counts captured audio only — it runs exactly while you are being
             heard, and holds while paused. -->
        <span id="timer">0:00</span>
        <!-- Pause holds the dictation: capture and timer freeze, and pressing
             it again resumes the same dictation. While paused it shows the
             resume (play) glyph. -->
        <button id="pause" title="Pause" aria-label="Pause" aria-pressed="false" disabled>
          <svg class="icon-pause" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <path
              d="M5.6 4.2 V11.8 M10.4 4.2 V11.8"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              fill="none"
            />
          </svg>
          <svg class="icon-resume" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <path
              d="M6 3.9v8.2c0 .78.86 1.25 1.52.84l6.56-4.1a.99.99 0 0 0 0-1.68L7.52 3.06C6.86 2.65 6 3.12 6 3.9Z"
              fill="currentColor"
            />
          </svg>
        </button>
        <!-- Done: the one filled key — finish the dictation and let Earheart
             transcribe and deliver the text. -->
        <button id="stop" title="Done — transcribe and insert" aria-label="Done — transcribe and insert">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <path
              d="M3.4 8.6 L6.7 11.8 L12.6 4.6"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
              fill="none"
            />
          </svg>
        </button>
        <!-- Discard: a plain X — cancel the dictation, nothing gets typed. -->
        <button id="cancel" title="Discard — nothing is typed" aria-label="Discard dictation">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <path
              d="M4.3 4.3 L11.7 11.7 M11.7 4.3 L4.3 11.7"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              fill="none"
            />
          </svg>
        </button>
      </div>
    </div>
    <script src="speech-probe.js"></script>
    <script src="transcript.js"></script>
    <script src="overlay.js"></script>
  </body>
</html>
