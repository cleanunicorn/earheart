<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
  <title>Commands · Earheart</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="palette.css" />
</head>
<body>
  <main role="dialog" aria-modal="true" aria-label="Commands">
    <header><h1>Commands</h1><button id="close" aria-label="Close Commands">Esc</button></header>
    <label for="search">Search commands and saved dictations</label>
    <input id="search" type="search" maxlength="200" role="combobox" aria-autocomplete="list" aria-expanded="true" aria-controls="results" autocomplete="off" />
    <p id="status" role="status" aria-live="polite"></p>
    <div id="results" role="listbox" aria-label="Commands and History"></div>
    <p class="hint">↑ ↓ to select · Enter to open · Esc to close. To dictate, focus your destination after closing.</p>
  </main>
  <script src="palette.js"></script>
</body>
</html>
